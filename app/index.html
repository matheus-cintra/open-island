<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Island</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="island" id="island" aria-label="Open Island">
      <section class="view view-compact visible" id="compact-view" aria-hidden="false">
        <div class="compact-row" id="compact-row"></div>
      </section>

      <section class="view view-expanded" id="expanded-view" aria-hidden="true">
        <header class="island-header">
          <span class="header-dot" aria-hidden="true"></span>
          <span class="header-label" id="header-label">0 sessões ativas</span>
          <div class="header-usage" id="header-usage" hidden></div>
          <div class="header-actions">
            <span class="header-usage-model" id="header-usage-model" hidden></span>
            <button class="header-button" id="header-mute" type="button">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                <path d="M8.6 2.6 5 5.6H2.4v4.8H5l3.6 3V2.6Z" />
                <g id="header-mute-waves"><path d="M11.2 5.8a3 3 0 0 1 0 4.4M13.2 3.8a5.8 5.8 0 0 1 0 8.4" /></g>
                <g id="header-mute-cross" hidden><path d="M11.4 6.2l3.4 3.6M14.8 6.2l-3.4 3.6" /></g>
              </svg>
            </button>
            <button class="header-button header-update" id="header-update" type="button" hidden>
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                <path d="M8 2.4v7.2M5.2 6.8 8 9.6l2.8-2.8M2.8 11.2v1.4a1 1 0 0 0 1 1h8.4a1 1 0 0 0 1-1v-1.4" />
              </svg>
            </button>
            <button class="header-button" id="header-settings" type="button">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                <circle cx="8" cy="8" r="2.2" />
                <path d="M8 1.4v1.8M8 12.8v1.8M14.6 8h-1.8M3.2 8H1.4M12.7 3.3l-1.3 1.3M4.6 11.4l-1.3 1.3M12.7 12.7l-1.3-1.3M4.6 4.6L3.3 3.3" />
              </svg>
            </button>
          </div>
        </header>
        <section
          class="approval-card"
          id="approval-card"
          aria-label="Permissão pendente"
          aria-live="assertive"
          hidden
        >
          <div class="approval-copy">
            <span class="approval-kicker" id="approval-kicker">Permissão solicitada</span>
            <strong class="approval-tool" id="approval-tool"></strong>
            <span class="approval-summary" id="approval-summary"></span>
            <pre class="approval-diff" id="approval-diff" hidden></pre>
          </div>
          <div class="approval-actions" id="approval-actions" aria-label="Ações da permissão">
            <button class="approval-button approval-button-allow" id="approval-allow" type="button">
              Permitir
            </button>
            <button class="approval-button approval-button-always" id="approval-always" type="button" hidden>
              Sempre
            </button>
            <button class="approval-button approval-button-deny" id="approval-deny" type="button">
              Negar
            </button>
          </div>
        </section>
        <section
          class="question-card"
          id="question-card"
          aria-live="assertive"
          hidden
        >
          <div class="question-head">
            <span class="question-kicker" id="question-kicker"></span>
            <span class="question-count" id="question-count"></span>
          </div>
          <div class="question-body" id="question-body"></div>
          <div class="question-actions" id="question-actions"></div>
        </section>
        <ul class="session-list" id="session-list"></ul>
        <div class="jump-error" id="jump-error" role="status" hidden></div>
      </section>
    </main>
  </body>
</html>
