name: Build experimental DMGs
on:
  push:
    branches: ['build/macos-*']
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dmg:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
            macho: arm64
          - runner: macos-15-intel
            arch: x86_64
            macho: x86_64
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run tauri build --bundles app,dmg
        working-directory: app
      - run: sh scripts/verify-macos-bundle.sh 'app/target/release/bundle/macos/Open Island.app' '${{ matrix.macho }}'
      - run: |
          mkdir -p artifacts
          cp app/target/release/bundle/dmg/*.dmg artifacts/open-island-macos-${{ matrix.arch }}.dmg
          cp app/target/release/bundle/macos/*.app.tar.gz artifacts/open-island-macos-${{ matrix.arch }}.app.tar.gz
          cp app/target/release/bundle/macos/*.app.tar.gz.sig artifacts/open-island-macos-${{ matrix.arch }}.app.tar.gz.sig
          cd artifacts
          shasum -a 256 *.dmg *.app.tar.gz *.sig > SHA256SUMS-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
      - run: python3 ../scripts/test-processes.py cargo test --workspace
        working-directory: app
      - name: Test signed update and real daemon restart
        working-directory: app
        run: |
          set -- target/release/bundle/macos/*.app.tar.gz
          test "$#" -eq 1
          export OPEN_ISLAND_UPDATER_ARCHIVE="$PWD/$1"
          export OPEN_ISLAND_TEST_LOG=/tmp/open-island-updater-tests.log
          python3 ../scripts/test-processes.py cargo test -p open-island --lib update_macos::tests:: -- --ignored --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.arch }}
          path: /tmp/open-island*tests.log
          if-no-files-found: ignore
