name: macOS daemon verification
on:
  push:
    branches: [build/macos-socket-tests-20260911]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 ../scripts/test-processes.py cargo test -p open-islandd -p open-island-core
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.runner }}
          path: /tmp/open-island-tests.log
