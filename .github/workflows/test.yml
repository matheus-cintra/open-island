name: Compatibility
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgtk-layer-shell-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run prebundle
        working-directory: app
      - run: bun run build
        working-directory: app
      - if: runner.os == 'macOS'
        run: >-
          bun run tauri build --bundles app,dmg
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
        working-directory: app
      - if: runner.os == 'macOS'
        run: sh scripts/verify-macos-bundle.sh "app/target/release/bundle/macos/Open Island.app" "$(uname -m)"
      - run: python3 ../scripts/test-processes.py cargo test --workspace
        working-directory: app
      - run: bun run test
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-${{ matrix.runner }}
          path: /tmp/open-island-tests.log
