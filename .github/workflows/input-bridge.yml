name: Native terminal input tests
on:
  push:
    branches: ['test/macos-input-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      OPEN_ISLAND_TEST_LOG: /tmp/open-island-input-tests.log
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          cache-on-failure: true
      - run: python3 ../scripts/test-processes.py cargo test -p open-island-core -p open-islandd -- --nocapture
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-tests-${{ matrix.runner }}
          path: /tmp/open-island-input-tests.log
