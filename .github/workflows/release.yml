name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            deb_arch: amd64
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply the tag version to the manifests
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Install frontend dependencies
        working-directory: app
        run: bun install

      - name: Build the deb and rpm bundles
        working-directory: app
        run: bun run tauri build --bundles deb,rpm

      - name: Regression tests
        working-directory: app
        run: |
          python3 ../scripts/test-processes.py cargo test --workspace
          bun run test

      - name: Assemble the release assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle_dir="app/target/release/bundle"

          deb_source="$(find "$bundle_dir/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          rpm_source="$(find "$bundle_dir/rpm" -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          staging_dir="${deb_source%.deb}"
          test -n "$deb_source"
          test -n "$rpm_source"
          test -d "$staging_dir/data/usr"

          deb_name="open-island_${version}_${{ matrix.deb_arch }}.deb"
          rpm_name="open-island-${version}-${{ matrix.arch }}.rpm"
          tarball_name="open-island-${version}-${{ matrix.arch }}-linux.tar.gz"

          rm -rf release
          mkdir -p release/assets release/tree/share/applications release/tree/share/icons
          install -Dm755 "$staging_dir/data/usr/bin/open-island" release/tree/bin/open-island
          install -Dm755 "$staging_dir/data/usr/bin/open-islandd" release/tree/bin/open-islandd
          cp -R "$staging_dir/data/usr/share/icons/hicolor" release/tree/share/icons/hicolor
          cp "$staging_dir/data/usr/share/applications/Open Island.desktop" \
            release/tree/share/applications/open-island.desktop

          tar --owner=0 --group=0 --numeric-owner \
            -czf "release/assets/$tarball_name" -C release/tree bin share
          cp "$deb_source" "release/assets/$deb_name"
          cp "$rpm_source" "release/assets/$rpm_name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: release/assets/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (experimental)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
            target: aarch64-apple-darwin
            macho: arm64
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
            macho: x86_64
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run tauri build --target ${{ matrix.target }} --bundles app,dmg
        working-directory: app
      - run: sh scripts/verify-macos-bundle.sh "app/target/${{ matrix.target }}/release/bundle/macos/Open Island.app" "${{ matrix.macho }}"
      - run: python3 ../scripts/test-processes.py cargo test --workspace
        working-directory: app
      - run: bun run test
        working-directory: app
      - name: Test signed update and real daemon restart
        working-directory: app
        run: |
          set -- target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
          test "$#" -eq 1
          export OPEN_ISLAND_UPDATER_ARCHIVE="$PWD/$1"
          export OPEN_ISLAND_TEST_LOG=/tmp/open-island-updater-tests.log
          python3 ../scripts/test-processes.py cargo test -p open-island --lib update_macos::tests:: -- --ignored --test-threads=1
      - run: |
          mkdir -p release/assets
          cp app/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "release/assets/open-island-macos-${{ matrix.arch }}.dmg"
          cp app/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz "release/assets/open-island-macos-${{ matrix.arch }}.app.tar.gz"
          cp app/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig "release/assets/open-island-macos-${{ matrix.arch }}.app.tar.gz.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-assets
          path: release/assets/*
          if-no-files-found: error

  publish:
    needs: [build, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-assets'
          merge-multiple: true
          path: release/assets
      - name: Assemble signed macOS updater index
        run: python3 scripts/updater-manifest.py "$GITHUB_REF_NAME" release/assets "$GITHUB_REPOSITORY"
      - name: Consolidate checksums
        working-directory: release/assets
        run: |
          sha256sum * > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--title "$GITHUB_REF_NAME" --generate-notes)
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "${flags[@]}" \
            release/assets/*
